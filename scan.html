<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="scan-manifest.json">
<link rel="apple-touch-icon" href="scan-icon-180.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
/* 📷 8/11: ΕΛΑΦΡΙΑ εφαρμογή «Σάρωση» — ΔΕΝ φορτώνει το Παραδόχαρτο, ΔΕΝ ζητά κωδικό.
   1η φορά: «Ζήτα έγκριση» → έγκριση από το Παραδόχαρτο (Ρυθμίσεις → Σάρωση → Συσκευές σάρωσης).
   Μετά: ανοίγει κατευθείαν η κάμερα → λήψη → σελίδες κρυπτογραφημένες με κλειδί ΜΙΑΣ ΧΡΗΣΗΣ → scan_put (μόνο εγκεκριμένη συσκευή)
   → η εφαρμογή Claude ανοίγει με τον σύνδεσμο #s<αριθμός>k<κλειδί> (το κλειδί δεν πάει ποτέ στη βάση). */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cam{position:relative;flex:1;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:16px;line-height:1.45}
.bar{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px 22px;min-height:110px}
.shot{flex:none;width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#34C759}
.shot:active{transform:scale(.94)}
.gal{flex:none;width:52px;height:56px;border:0;border-radius:14px;background:#ffffff26;color:#fff;font-size:28px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;background:#34C759;color:#fff;min-width:220px}
.btn.sec{background:#ffffff26}
input[type=text]{font-size:17px;padding:12px;border-radius:12px;border:0;width:260px;max-width:90vw;text-align:center}
.spin{width:30px;height:30px;border:3px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a.go{display:block;text-align:center;text-decoration:none;background:#34C759;color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:17px;width:280px;max-width:90vw}
a.go2{color:#9fd4ff;font-size:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
/* 📄 9/11: σκάνερ εγγράφων — μπλε περίγραμμα χαρτιού, αυτόματη λήψη, ίσιωμα σε Α4 */
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000a;color:#fff;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap}
#ed{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#edw{position:relative;flex:1;overflow:hidden;touch-action:none}
#edc,#edo{position:absolute;left:0;top:0}
.edb{display:flex;gap:12px;justify-content:center;padding:14px 10px 22px}
</style>
</head><body>
<div id="app">
  <div class="cam"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div class="hint" id="hint" style="display:none"></div><div class="flash" id="fl"></div><div class="msg" id="msg"><div class="spin"></div></div></div>
  <div class="bar" id="bar" style="visibility:hidden"><button class="gal" id="gal" aria-label="Από τις φωτογραφίες">🖼</button><button class="shot" id="shot" aria-label="Λήψη"></button><button class="gal" id="mod" aria-label="Τι σαρώνω" style="width:auto;min-width:96px;padding:0 10px;font-size:13px;font-weight:800;line-height:1.2"></button></div>
</div>
<div id="ed"><div id="edw"><canvas id="edc"></canvas><canvas id="edo"></canvas><div class="hint">Σύρε τις μπλε γωνίες στις άκρες του χαρτιού</div></div>
  <div class="edb"><button class="btn sec" id="edx" style="min-width:0">↺ Ξανά</button><button class="btn sec" id="edf" style="min-width:0">Όλη η φωτό</button><button class="btn" id="edk" style="min-width:0;background:#0A84FF">✓ Σάρωση</button></div></div>
<input id="gf" type="file" accept="image/*" multiple style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px">
<input id="cf" type="file" accept="image/*" capture="environment" style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px">
<script>
'use strict';
const SB = 'https://evspmufooxgqxhbhydgc.supabase.co', KEY = 'sb_publishable_BOFN2Mb4jDGWcAqaIbNy_Q_FYvsz7y2';
const CLAUDE = 'https://claude.ai/artifact/7WCs97EfWrAuqWokMGWLbd', CLAUDE_APP = CLAUDE.replace(/^https:\/\//, 'claude://');
const TK = 'pdx_scan_token', $ = (id)=>document.getElementById(id);
const E = s=>String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok = { get(){ try{ return localStorage.getItem(TK) || ''; }catch(e){ return ''; } }, set(v){ try{ localStorage.setItem(TK, v); }catch(e){} }, del(){ try{ localStorage.removeItem(TK); }catch(e){} } };
async function rpc(fn, args){
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey: KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args || {}) });
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
  return j;
}
const msg = (h)=>{ $('msg').style.display = 'flex'; $('msg').innerHTML = h; };
const devName = ()=>{ const u = navigator.userAgent; return (/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':'Συσκευή'); };

// ---------- 1η φορά: έγκριση ----------
async function setup(){
  $('bar').style.visibility = 'hidden';
  msg('<div style="font-size:56px">📷</div><b style="font-size:20px">Σάρωση — πρώτη φορά</b><div style="opacity:.8">Η συσκευή χρειάζεται μία έγκριση από το Παραδόχαρτο.</div>'
    + '<input type="text" id="nm" placeholder="Όνομα (π.χ. iPhone Νίκου)" value="'+E(devName())+'"><button class="btn" id="req">📱 Ζήτα έγκριση</button>');
  $('req').onclick = async ()=>{
    $('req').disabled = true; $('req').textContent = '⏳…';
    try{ const r = await rpc('scan_device_request', { p_label: ($('nm').value || devName()).trim().slice(0, 60) }); const x = Array.isArray(r) ? r[0] : r; tok.set(x.token); waitApproval(); }
    catch(e){ $('req').disabled = false; $('req').textContent = '📱 Ζήτα έγκριση'; alertMsg('⚠ ' + e.message); }
  };
}
function alertMsg(t){ const d = document.createElement('div'); d.style.cssText = 'margin-top:8px;color:#ff8a80'; d.textContent = t; $('msg').appendChild(d); }
async function waitApproval(){
  msg('<div class="spin"></div><b style="font-size:19px">Περιμένει έγκριση</b><div style="opacity:.85;max-width:320px">Στο Παραδόχαρτο: <b>Ρυθμίσεις → Σάρωση → 📱 Συσκευές σάρωσης → Έγκριση</b><br>Μόλις εγκριθεί, ανοίγει μόνη της η κάμερα.</div><button class="btn sec" id="re" style="min-width:0;font-size:14px;padding:9px 14px">Νέο αίτημα</button>');
  $('re').onclick = ()=>{ tok.del(); setup(); };
  for(;;){
    let s = 'pending'; try{ s = await rpc('scan_device_status', { p_token: tok.get() }); }catch(e){}
    if(s === 'approved') return camera();
    if(s === 'unknown'){ tok.del(); return setup(); }
    await new Promise(r=>setTimeout(r, document.hidden ? 15000 : 3000));
  }
}

// ---------- κάμερα ----------
let stream = null, busy = false;
// 📷 10/11 (χρήστης: «γράφει εγγραφή κάμερας/βίντεο»): το iPhone δείχνει την κόκκινη κάμερα όσο η κάμερα είναι ανοιχτή (δεν γράφεται βίντεο).
// Η κάμερα κλείνει: στο μενού «Τι σαρώνω», όταν φεύγεις από την εφαρμογή, και μετά από 90″ χωρίς λήψη · ξανανοίγει με ένα πάτημα.
let camIdle = 0;
function camStop(){ clearTimeout(camIdle); if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} stream = null; } try{ $('v').srcObject = null; }catch(e){} }
function camKick(){ clearTimeout(camIdle); camIdle = setTimeout(()=>{ if(busy || !stream || document.hidden) return; camStop();
  msg('<div style="font-size:48px">📷</div><div>Η κάμερα έκλεισε (δεν χρησιμοποιήθηκε)</div><button class="btn" id="camon">Άνοιγμα κάμερας</button>'); $('camon').onclick = ()=>camera(); }, 90000); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ camStop(); return; } setTimeout(()=>{ if(!document.hidden && !stream && !busy && $('msg').style.display === 'none') camera(); }, 300); });
async function camera(){
  $('bar').style.visibility = 'visible';
  msg('<div class="spin"></div>');
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:'environment' }, width:{ ideal:3840 }, height:{ ideal:2160 } } });
    const v = $('v'); v.srcObject = stream; await v.play().catch(()=>{});
    $('msg').style.display = 'none'; camKick();
    try{ const tr = stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {}; if(cap.focusMode && cap.focusMode.includes('continuous')) await tr.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); }catch(e){}
    $('shot').onclick = ()=>{ if(busy || !v.videoWidth) return; camKick(); $('fl').style.opacity = '.8'; setTimeout(()=>{ $('fl').style.opacity = '0'; }, 120); shoot(); };
    live();
  }catch(e){
    // δεν επιτράπηκε η ζωντανή κάμερα → η κάμερα του κινητού
    msg('<div style="font-size:60px">📷</div><div>Πάτα τον <b>πράσινο κύκλο</b> και τράβηξε</div><div style="opacity:.7;font-size:14px">ή 🖼 για φωτογραφίες από τη συλλογή</div>');
    $('shot').onclick = ()=>{ if(busy) return; $('cf').value = ''; $('cf').click(); };
  }
  $('gal').onclick = ()=>{ if(busy) return; $('gf').value = ''; $('gf').click(); };
}
async function fromFiles(fs){ fs = [...(fs || [])].slice(0, 4); if(!fs.length) return; const bm = []; for(const f of fs){ try{ bm.push(await createImageBitmap(f)); }catch(e){} } if(!bm.length) return;
  if(scOn() && bm.length === 1){ const c = DS.grab(bm[0], bm[0].width, bm[0].height), q = DS.detectOn(c, c.width, c.height); if(q) return editor(c, q); }
  if(scOn()){ const out = bm.map(b=>{ const c = DS.grab(b, b.width, b.height), q = DS.detectOn(c, c.width, c.height); return q ? DS.warp(c, q) : b; }); return send(out); }
  send(bm); }
// 🔄 9/11 (χρήστης: «μόνιμα σκάνερ· οριζόντιο Α4 = πρόγραμμα, όρθιο = ιστορικό· ή κουμπί επιλογής»): ΕΝΑ κουμπί «τι σαρώνω» (pdx_scan_mode):
//  ""  = 🔄 Αυτόματα — οριζόντια φωτογραφία → πρόγραμμα χειρουργείου (email) · όρθια → ιστορικό/πόρισμα (Claude)
//  "prog" = 🗓 Πρόγραμμα (πάντα, και όρθια φωτογραφία) · "hist" = 📄 Ιστορικό/πόρισμα (πάντα Claude) · "op" = 📝 Πρακτικό (βιβλίο → φωτογραφία, ΧΩΡΙΣ ανίχνευση φύλλου)
// Ο ανιχνευτής φύλλου (σκάνερ) μόνο στο «🗓 Πρόγραμμα».
const MODE = 'pdx_scan_mode';
const MODES = { '': ['🔄', 'Αυτόματα', 'οριζόντιο χαρτί → πρόγραμμα · όρθιο → ιστορικό/πόρισμα'], prog: ['🗓', 'Πρόγραμμα', 'πρόγραμμα χειρουργείου → email'], hist: ['📄', 'Ιστορικό', 'ιστορικό ή πόρισμα (π.χ. αξονικής) → Claude'], op: ['📝', 'Πρακτικό', 'πρακτικό χειρουργείου από το βιβλίο → Claude'] };
const modeGet = ()=>{ try{ const m = localStorage.getItem(MODE); if(m != null) return MODES[m] ? m : '';
  const old = localStorage.getItem('pdx_scan_op') === '1' ? 'op' : localStorage.getItem('pdx_scan_rot') === '1' ? 'prog' : ''; localStorage.setItem(MODE, old); return old; }catch(e){ return ''; } };
const opOn = ()=>modeGet() === 'op', rotOn = ()=>modeGet() === 'prog', histOn = ()=>modeGet() === 'hist';
const modePaint = ()=>{ const m = modeGet(), M = MODES[m], b = $('mod'); b.innerHTML = M[0] + ' ' + M[1] + ' ▾'; b.style.background = m ? (m === 'prog' ? '#34C759' : m === 'op' ? '#AF52DE' : '#0A84FF') : '#ffffff26'; };
const modeSet = (x)=>{ try{ localStorage.setItem(MODE, x); }catch(e){} modePaint(); };
$('mod').onclick = ()=>{ if(busy) return; camStop(); const cur = modeGet();
  msg('<b style="font-size:19px">Τι σαρώνω;</b>' + Object.keys(MODES).map(k=>'<button class="btn" data-m="' + k + '" style="width:100%;max-width:340px;text-align:left;background:' + (k === cur ? '#0A84FF' : '#ffffff1f') + '"><b>' + MODES[k][0] + ' ' + MODES[k][1] + '</b><br><span style="font-size:13px;font-weight:500;opacity:.85">' + MODES[k][2] + '</span></button>').join(''));
  // 💬 ίδια συζήτηση Claude για όλες τις σαρώσεις: επικόλληση του συνδέσμου της (Claude → ⋯ → Κοινοποίηση/Αντιγραφή συνδέσμου ή από τη γραμμή διεύθυνσης)
  let cur0 = ''; try{ cur0 = localStorage.getItem('pdx_scan_chat') || ''; }catch(e){}
  if(false) $('msg').insertAdjacentHTML('beforeend', '<button class="btn" id="chatpin" style="width:100%;max-width:340px;text-align:left;background:#ffffff1f"><b>💬 ' + (cur0 ? 'Ίδια συζήτηση Claude ✓' : 'Νέα συζήτηση Claude σε κάθε σάρωση') + '</b><br><span style="font-size:13px;font-weight:500;opacity:.85">' + (cur0 ? 'πάτα για αλλαγή ή για νέα κάθε φορά' : 'πάτα για να ορίσεις μία συζήτηση για όλες') + '</span></button>');
  // 📄 10/11 (χρήστης: «σε υπάρχουσα συζήτηση αλλά να μην επικολλώ»): η εφαρμογή Claude ΔΕΝ δέχεται έτοιμο μήνυμα σε υπάρχουσα συζήτηση → εναλλακτικά
  // η «Σελίδα Σάρωσης» (artifact): ΠΑΝΤΑ η ίδια σελίδα, διαβάζει ΜΟΝΗ της τη σάρωση (χωρίς νέα συζήτηση, χωρίς επικόλληση). Επιλογή ανά συσκευή (pdx_scan_via).
  { let v0 = 'chat'; try{ v0 = localStorage.getItem('pdx_scan_via') || 'chat'; }catch(e){}
    $('msg').insertAdjacentHTML('beforeend', '<div style="width:100%;max-width:340px;margin-top:10px;font-size:13px;opacity:.8">Πού διαβάζεται:</div>'
      + '<button class="btn" data-via="page" style="width:100%;max-width:340px;text-align:left;background:' + (v0 === 'page' ? '#0A84FF' : '#ffffff1f') + '"><b>📄 Σελίδα Σάρωσης</b><br><small style="opacity:.8">πάντα η ίδια · διαβάζεται μόνη της · χωρίς επικόλληση</small></button>'
      + '<button class="btn" data-via="chat" style="width:100%;max-width:340px;text-align:left;background:' + (v0 !== 'page' ? '#0A84FF' : '#ffffff1f') + '"><b>💬 Νέα συζήτηση Claude</b><br><small style="opacity:.8">για συναδέλφους με άλλον λογαριασμό</small></button>');
    $('msg').querySelectorAll('[data-via]').forEach((x)=>x.onclick = ()=>{ try{ localStorage.setItem('pdx_scan_via', x.dataset.via); }catch(e){} $('mod').onclick(); }); }
  if($('chatpin')) $('chatpin').onclick = ()=>{ const v = prompt('Σύνδεσμος της συζήτησης Claude (https://claude.ai/chat/…). Κενό = νέα συζήτηση κάθε φορά.', cur0); if(v == null) return;
    const t = v.trim();
    // 10/11: σύνδεσμος «Κοινοποίησης» (claude.ai/share/…) = αντίγραφο μόνο για ανάγνωση· δεν συνεχίζει τη συζήτηση
    if(/claude\.ai\/share\//.test(t)){ alert('Αυτός είναι σύνδεσμος «Κοινοποίησης» (claude.ai/share/…): ανοίγει αντίγραφο μόνο για ανάγνωση, όχι τη συζήτηση.\n\nΧρειάζεται ο σύνδεσμος claude.ai/chat/…:\n1. Άνοιξε το claude.ai στο Safari (όχι την εφαρμογή)\n2. Άνοιξε τη συζήτηση\n3. Πάτα τη γραμμή διεύθυνσης → Αντιγραφή\n4. Επικόλλησε εδώ'); return; }
    if(t && !/^https:\/\/claude\.ai\/chat\/[0-9a-f-]{36}/.test(t)){ alert('Δεν είναι σύνδεσμος συζήτησης Claude (https://claude.ai/chat/…)'); return; }
    try{ if(t) localStorage.setItem('pdx_scan_chat', t); else localStorage.removeItem('pdx_scan_chat'); }catch(e){} $('mod').onclick(); };
  $('msg').querySelectorAll('[data-m]').forEach(x=>x.onclick = ()=>{ modeSet(x.dataset.m); $('msg').style.display = stream ? 'none' : 'flex'; if(!stream) camera(); }); };
modePaint();
$('gf').onchange = (e)=>fromFiles(e.target.files);
$('cf').onchange = (e)=>fromFiles(e.target.files);


// ================= 📄 ΣΚΑΝΕΡ ΕΓΓΡΑΦΩΝ (9/11, χρήστης: «κανονικό σκάνερ με τα μπλε, όχι σαν φωτό») =================
// Χωρίς βιβλιοθήκες: μικρό αντίγραφο του καρέ → γκρι → κατώφλι Otsu → μεγαλύτερη φωτεινή περιοχή (το χαρτί) → 4 γωνίες.
// Λήψη → μπλε γωνίες που σέρνονται → ίσιωμα (ομογραφία) σε Α4 (οριζόντιο αν το χαρτί είναι οριζόντιο) → «λεύκανση» σαν σκάνερ.
const scOn = ()=>rotOn();   // 9/11 (χρήστης): σκάνερ (γωνίες/ίσιωμα) ΜΟΝΟ για το πρόγραμμα χειρουργείου· ιστορικό/πόρισμα = απλή φωτογραφία (αρκεί η ανάγνωση λέξεων)
const DS = (()=>{
  // gray: Uint8Array w*h → τετράπλευρο [[x,y]×4] (πάνω-αρ, πάνω-δε, κάτω-δε, κάτω-αρ) σε συντεταγμένες της μικρής εικόνας ή null
  function quadGray(g, w, h){
    const n = w * h, b = new Uint8Array(n);
    for(let y = 1; y < h - 1; y++) for(let x = 1; x < w - 1; x++){ const i = y * w + x; b[i] = (g[i] * 4 + g[i-1] + g[i+1] + g[i-w] + g[i+w]) >> 3; }
    const hist = new Uint32Array(256); for(let i = 0; i < n; i++) hist[b[i]]++;
    let sum = 0; for(let t = 0; t < 256; t++) sum += t * hist[t];
    let sB = 0, wB = 0, best = 0, th = 128;
    for(let t = 0; t < 256; t++){ wB += hist[t]; if(!wB) continue; const wF = n - wB; if(!wF) break; sB += t * hist[t]; const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF); if(v > best){ best = v; th = t; } }
    if(best / (n * n) < 150) return null;              // χωρίς αντίθεση χαρτιού/φόντου
    const lab = new Int32Array(n), st = new Int32Array(n); let bestL = 0, bestA = 0, L = 0;
    for(let i0 = 0; i0 < n; i0++){ if(lab[i0] || b[i0] <= th) continue; L++; let sp = 0, a = 0; st[sp++] = i0; lab[i0] = L;
      while(sp){ const i = st[--sp]; a++; const x = i % w, y = (i / w) | 0;
        if(x > 0 && !lab[i-1] && b[i-1] > th){ lab[i-1] = L; st[sp++] = i-1; } if(x < w-1 && !lab[i+1] && b[i+1] > th){ lab[i+1] = L; st[sp++] = i+1; }
        if(y > 0 && !lab[i-w] && b[i-w] > th){ lab[i-w] = L; st[sp++] = i-w; } if(y < h-1 && !lab[i+w] && b[i+w] > th){ lab[i+w] = L; st[sp++] = i+w; } }
      if(a > bestA){ bestA = a; bestL = L; } }
    if(bestA < n * 0.12) return null;                   // πολύ μικρό για χαρτί
    let tl, tr, br, bl, mTL = 1e9, mBR = -1e9, mTR = -1e9, mBL = 1e9, minY = h, minX = w, maxX = 0, maxY = 0;

    // → ΣΥΖΗΤΗΣΗ Claude: νέα συζήτηση με έτοιμο μήνυμα «διάβασε τη σάρωση #s…k…» → εργαλεία scan_read/scan_save της σύνδεσης «Παραδόχαρτο».

    const ask = 'Διάβασε τη σάρωση του Παραδόχαρτου ' + tag + ' και πέρασέ τη στο Παραδόχαρτο.';
    // 9/11: μέσα στην εφαρμογή «Σάρωση» (PWA) το https://claude.ai άνοιγε ΜΕΣΑ στη Σάρωση → σχήμα claude:// (ανοίγει την εφαρμογή Claude, όπως η σελίδα)
    // 9/11 (χρήστης: «ίδια συζήτηση, όχι 100 συνομιλίες για 100 ιστορικά»): αν έχει οριστεί σύνδεσμος συζήτησης (pdx_scan_chat) → εκεί
    // 10/11 (χρήστης: «χθες με νέα συζήτηση έγραφε, σήμερα όχι»): η εφαρμογή Claude γεμίζει το μήνυμα ΜΟΝΟ σε νέα συζήτηση (/new?q=)· σε υπάρχουσα (/chat/…) το αγνοεί → πάντα νέα
    const chatPath = '/new';
    const chatW = 'https://claude.ai' + chatPath + '?q=' + encodeURIComponent(ask), chatU = chatW.replace(/^https:\/\//, 'claude://');
    // 9/11 (χρήστης: «το πάτημα της λήψης να είναι και εντολή αποστολής στο Claude, χωρίς κουμπί»): προεπιλογή = συζήτηση Claude ΑΜΕΣΑ
    let via = 'chat'; try{ via = localStorage.getItem('pdx_scan_via') || 'chat'; }catch(e){}
    if(op) via = 'page';
    window.__scanNav = via === 'page' ? CLAUDE_APP + tag : via === 'chat' ? chatU : '';
    window.__scanAsk = ask; if(window.__clipRes) window.__clipRes.ok(ask);
    msg('<div style="font-size:54px">🤖</div><div>' + (via ? 'Ανοίγει το Claude…' : 'Πού να διαβαστεί;') + '</div>'
      + (op ? '' : '<a class="go" id="vchat" href="' + chatU + '">💬 Συζήτηση Claude</a><a class="go2" href="' + chatW + '" target="_blank" rel="noopener">ή στον browser</a><div style="font-size:13px;opacity:.75;max-width:320px;text-align:center">με τη σύνδεση «Παραδόχαρτο» στον λογαριασμό σου (συνάδελφοι)· αν δεν γραφτεί μόνο του το μήνυμα: Επικόλληση</div>')
      + '<a class="go2" id="vpage" href="' + CLAUDE_APP + tag + '">📄 Σελίδα Σάρωσης (διαχειριστής)</a>');
    const remember = (v)=>{ try{ localStorage.setItem('pdx_scan_via', v); }catch(e){} };
    if($('vchat')) $('vchat').onclick = ()=>{ remember('chat'); try{ navigator.clipboard && navigator.clipboard.writeText(ask); }catch(e){} };
    $('vpage').onclick = ()=>{ if(!op) remember('page'); };
    if(via === 'chat' && !window.__clipRes){ try{ navigator.clipboard && navigator.clipboard.writeText(ask).catch(()=>{}); }catch(e){} }
    if(via && !window.__scanNoNav){ try{ location.href = window.__scanNav; }catch(e){} }
    setTimeout(()=>{ busy = false; }, 1500);
    // όταν ξαναγυρίσεις στην εφαρμογή: πάλι κάμερα
    const back = ()=>{ if(document.hidden) return; document.removeEventListener('visibilitychange', back); if(stream) $('msg').style.display = 'none'; else camera(); };
    setTimeout(()=>document.addEventListener('visibilitychange', back), 800);
  }catch(e){
    busy = false;
    if(/έγκριση/.test(e.message)){ tok.del(); return setup(); }
    msg('<div style="font-size:40px">⚠</div><div>Δεν ανέβηκε: ' + E(e.message) + '</div><button class="btn" id="again">Ξανά</button>'); $('again').onclick = ()=>{ $('msg').style.display = stream ? 'none' : 'flex'; if(!stream) camera(); };
  }
}

// ---------- εκκίνηση ----------
(async ()=>{
  if(!tok.get()) return setup();
  let s = 'approved'; try{ s = await rpc('scan_device_status', { p_token: tok.get() }); }catch(e){ s = 'approved'; }   // χωρίς δίκτυο: δοκίμασε κάμερα
  if(s === 'approved') return camera();
  if(s === 'pending') return waitApproval();
  tok.del(); setup();
})();
</script>
