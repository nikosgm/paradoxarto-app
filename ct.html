<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D11">
<title>Νίκος CT Viewer</title>
<link rel="manifest" href="ct-manifest.json">
<link rel="icon" href="ct-icon-192.png">
<link rel="apple-touch-icon" href="ct-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ct.html v12 (2026-11-02) — ξαναχτισμένο: φάκελος κλινικής, αναζήτηση επωνύμου, ταυτοποίηση, MIP, εκτύπωση.
   Σκόπιμα μόνο σκοτεινό (όπως οι οθόνες ακτινολογίας). Οι εικόνες διαβάζονται ΜΟΝΟ σε αυτή τη συσκευή. */
:root{
  /* σαν RadiAnt: ουδέτερο σκούρο γκρι, μπλε τόνος, λεπτές μπάρες — αλλά πιο ανάλαφρο */
  --bg:#000; --panel:#1C1D20; --panel2:#232428; --line:#2E3036; --fg:#E6E8EB; --muted:#8B9099;
  --accent:#3B9CFF; --accent-ink:#fff; --ok:#4CD38A; --warn:#F5A524; --bad:#FF5A5A;
  --font-ui:-apple-system,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr;grid-template-columns:150px 1fr;grid-template-areas:"top top" "tools tools" "pt pt" "rail view"}
header{grid-area:top;display:flex;align-items:center;gap:6px;min-width:0;
  padding:calc(5px + var(--sat) + min(var(--sat), 20px)) max(8px,var(--sar)) 5px max(8px,var(--sal));background:linear-gradient(#26272B,#1C1D20);border-bottom:1px solid #000}
header h1{font-size:13px;font-weight:600;margin:0 6px 0 2px;color:var(--muted);white-space:nowrap}
.back{color:var(--fg);text-decoration:none;font-size:20px;line-height:1;padding:3px 9px 5px;border-radius:6px}
.back:hover{background:#ffffff14}
.ib{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500}
.ib span{font-size:12px;color:var(--muted)}
.ib:hover:not(:disabled){background:#ffffff12}
.ib:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib.primary{background:var(--accent);color:#fff} .ib.primary span{color:#fff}
.ib.on{background:#3B9CFF26;border-color:#3B9CFF66;color:#8EC5FF} .ib.on span{color:#8EC5FF}
.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.status{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-left:6px}
.status b{color:var(--fg);font-weight:500} .status .good{color:var(--ok)}
.lock{font-size:11px;color:var(--muted);white-space:nowrap}
.tools{grid-area:tools;display:flex;align-items:center;gap:4px;padding:4px max(8px,var(--sar)) 4px max(8px,var(--sal));background:var(--panel);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;align-items:center;flex:none}
.grp.seg{background:#00000040;border-radius:7px;padding:2px}
.grp .k{font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin:0 4px}
.sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 4px}

/* γραμμή ασθενή / αναζήτησης */
.pt{grid-area:pt;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px max(10px,var(--sar)) 5px max(10px,var(--sal));border-bottom:1px solid #000;background:var(--panel2)}
.pt:empty{display:none}
.pt .who{font-weight:600}
.pt .sub{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pt .btn{white-space:normal;text-align:left}
.pt .ver{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.ver.ok{color:var(--ok)} .ver.mid{color:var(--warn)} .ver.bad{color:var(--bad)}
.cands{flex-basis:100%;display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer}
.cand:hover{border-color:var(--muted)} .cand.best{border-color:var(--accent)}
.cand .sc{font-family:var(--font-mono);font-size:12px;color:var(--accent);min-width:22px}
.cand .p{font-size:12.5px} .cand .p small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:11px;margin-top:2px;word-break:break-all}
.cand .tag{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* σειρές: μεγάλες μικρογραφίες σε στήλη, όπως στο RadiAnt */
.rail{grid-area:rail;background:var(--panel);border-right:1px solid #000;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.rail .lbl{display:none}
.rail .empty{font-size:12px;color:var(--muted);line-height:1.5;padding:6px}
.ser{position:relative;display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:#000;border:2px solid transparent;border-radius:6px;padding:0;cursor:pointer;overflow:hidden}
.ser:hover{border-color:#ffffff30}
.ser:focus-visible{outline:2px solid var(--accent)}
.ser.on{border-color:var(--accent)}
.ser canvas{width:100%;aspect-ratio:1/1;height:auto;display:block;background:#000}
.ser .t{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;background:linear-gradient(transparent,#000c)}
.ser .d{font-size:11px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser .m{font-family:var(--font-mono);font-size:10px;color:#C9CDD3;margin-top:1px}

.view{grid-area:view;position:relative;min-width:0;min-height:0;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:#E9EEF2;text-shadow:0 0 3px #000,0 0 2px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.ov.tl{top:8px;left:10px}.ov.tr{top:8px;right:10px;text-align:right}.ov.bl{bottom:30px;left:10px}.ov.br{bottom:30px;right:10px;text-align:right}
.ov .a{color:#FFD24A} .ov .w{color:var(--warn)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;pointer-events:none}
.drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);background:rgba(0,0,0,.7);pointer-events:none}
/* λεπτή μπάρα τομών μέσα στην εικόνα (κάτω) */
.slider{position:absolute;right:4px;top:8px;bottom:calc(8px + var(--sab));width:30px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.7;transition:opacity .2s;z-index:1}
.view:hover .slider,.slider:focus-within{opacity:1}
/* 7/11: κατακόρυφη μπάρα τομών στο πλάι (πάνω = τομή 1) */
.slider input{flex:1;min-height:0;width:26px;margin:0;accent-color:var(--accent);writing-mode:vertical-lr;direction:ltr;cursor:ns-resize}
.slider span{order:-1;font-family:var(--font-mono);font-size:10.5px;color:#C9CDD3;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 3px #000;writing-mode:horizontal-tb}
.ov.tr,.ov.br{right:44px}
.hint,.privacy{display:none}

#cv3{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;z-index:2}
#cv3:active{cursor:grabbing}
.p3{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:center;
  background:#16171Bdd;border:1px solid var(--line);border-radius:10px;padding:5px 8px;max-width:calc(100% - 16px);backdrop-filter:blur(6px)}
.p3 .grp{gap:2px} .p3 label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.p3 input[type=range]{width:96px;accent-color:var(--accent)}
.p3 .v{font-family:var(--font-mono);font-size:11px;color:#C9CDD3;min-width:52px}
body.is3d .ov,body.is3d .slider{display:none}
.inst{position:fixed;z-index:50;right:12px;bottom:calc(12px + var(--sab));max-width:340px;background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 10px 30px #000a}
.inst b{color:#fff} .inst .row{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;color:#000;overflow:visible;height:auto}
  .app{display:none!important}
  #printArea{display:block;font-family:var(--font-ui);color:#000}
  #printArea h2{font-size:16px;margin:0 0 4px}
  #printArea .meta{font-size:12px;margin:0 0 8px;line-height:1.5}
  #printArea img{max-width:100%;max-height:192mm;display:block;margin:0 auto}
  #printArea .foot{font-size:10.5px;color:#444;margin-top:6px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"top" "pt" "rail" "view" "tools"}
  .tools{border-top:1px solid #000;border-bottom:0;padding-bottom:calc(4px + var(--sab))}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid #000;padding:5px 8px;overflow-x:auto;overflow-y:hidden}
  .ser{width:64px;flex:none} .ser .d{display:none}
  .ib span,.lock,header h1{display:none}
  .ib{height:36px;min-width:36px}
  .slider{bottom:6px;top:30px}
}
#evoOv{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:stretch;justify-content:center;padding:24px}
#evoOv .evo-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1400px,100%);display:flex;flex-direction:column;overflow:hidden}
#evoOv .evo-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
#evoOv .evo-h b{font-size:16px;margin-right:6px}
#evoOv input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:150px}
#evoOv input[type=date]{width:auto;color-scheme:dark}
#evoOv label{color:var(--muted);display:flex;gap:4px;align-items:center}
#evoOv .evo-m{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#evoOv .evo-m button{background:none;border:0;color:var(--fg);padding:7px 10px;font-size:13px;cursor:pointer}
#evoOv .evo-m button.on{background:var(--accent);color:var(--accent-ink)}
#evoOv .evo-l{flex:1;overflow:auto}
#evoOv .evo-cnt{color:var(--muted);padding:8px 12px}
#evoOv .evo-empty{padding:40px;text-align:center;color:var(--fg);font-size:14px}
#evoOv .evo-t{width:100%;border-collapse:collapse;font-size:13.5px}
#evoOv .evo-t th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:8px 12px;color:var(--muted);font-weight:600}
#evoOv .evo-t td{padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap}
#evoOv .evo-t td:last-child{white-space:normal}
#evoOv .evo-t tr[data-ex]{cursor:pointer}
#evoOv .evo-t tr[data-ex]:hover{background:rgba(59,156,255,.14)}
#evoOv .evo-bar{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
#evoOv .evo-bar span{color:var(--muted);flex:1}
#evoOv .evo-ser{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px}
#evoOv .evo-ser button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;text-align:center}
#evoOv .evo-ser button:hover{border-color:var(--accent)}
#evoOv .evo-ser img{width:128px;height:128px;object-fit:contain;background:#000;border-radius:6px}
#evoOv .evo-ser .nt{font-size:48px;height:128px;display:flex;align-items:center}
#evoOv .evo-ser small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <a class="back" href="./" id="back" title="Πίσω στο Παραδόχαρτο">‹</a>
    <h1>Νίκος CT Viewer</h1>
    <button class="ib primary" id="srvBtn" title="Φάκελος κλινικής (OUROLOGIKH KLINIKH) — περιήγηση/αναζήτηση">📁<span>Κλινική</span></button>
    <button class="ib" id="pickDir" title="Άνοιγμα άλλου φακέλου (CD, δίκτυο)">🗂<span>Φάκελος</span></button>
    <button class="ib" id="pickFiles" title="Άνοιγμα αρχείων DICOM">📄<span>Αρχεία</span></button>
    <button class="ib" id="printBtn" disabled title="Εκτύπωση της τρέχουσας εικόνας με τις μετρήσεις">🖨<span>Εκτύπωση</span></button>
    <input type="file" id="dirIn" webkitdirectory multiple hidden>
    <input type="file" id="fileIn" multiple hidden>
    <div class="status" id="status">Άνοιξε τον φάκελο της κλινικής, ενός CD ή του δικτύου.</div>
    <button class="ib" id="instBtn" hidden title="Εγκατάσταση ως εφαρμογή υπολογιστή — ανοίγει χωρίς internet">💻<span>Εγκατάσταση</span></button>
    <span class="lock" title="Οι εικόνες διαβάζονται μόνο σε αυτή τη συσκευή· τίποτα δεν ανεβαίνει ή αποθηκεύεται.">🔒 τοπικά</span>
  </header>

  <nav class="tools" aria-label="Εργαλεία">
    <div class="grp" role="group" aria-label="Εργαλείο">
      <button class="ib" data-tool="scroll" title="Τομές (σύρσιμο πάνω/κάτω) · ροδέλα">⇕<span>Τομές</span></button>
      <button class="ib" data-tool="win" title="Παράθυρο/επίπεδο (W/L) — σύρσιμο με αυτό το εργαλείο · δεξί σύρσιμο = zoom">◐<span>W/L</span></button>
      <button class="ib" data-tool="pan" title="Μετακίνηση · μεσαίο κλικ">✥<span>Pan</span></button>
      <button class="ib" data-tool="zoom" title="Zoom · Ctrl+ροδέλα">⌕<span>Zoom</span></button>
      <button class="ib" data-tool="measure" title="Μέτρηση απόστασης (mm)">📏<span>mm</span></button>
      <button class="ib" data-tool="roi" id="roiBtn" title="HU περιοχής (μέσος/SD/min/max)">⬚<span>HU</span></button>
    </div>
    <i class="sep"></i>
    <div class="grp seg" role="group" aria-label="Επίπεδο">
      <button class="ib" data-plane="ax" title="Αξονική">AX</button>
      <button class="ib" data-plane="cor" title="Στεφανιαία (MPR)">COR</button>
      <button class="ib" data-plane="sag" title="Οβελιαία (MPR)">SAG</button>
      <button class="ib" id="refl" title="Γραμμές αναφοράς">✛</button>
      <button class="ib" id="mpr3" title="MPR: AX + COR + SAG μαζί, με σταυρό αναφοράς (X)">⊞ MPR</button>
      <button class="ib" id="b3d" title="3D απόδοση όγκου (D)">3D</button>
    </div>
    <i class="sep"></i>
    <div class="grp seg" role="group" aria-label="MIP">
      <span class="k">MIP</span>
      <button class="ib" data-mip="0" title="Χωρίς MIP">—</button>
      <button class="ib" data-mip="10" title="MIP 10 mm">10</button>
      <button class="ib" data-mip="30" title="MIP 30 mm">30</button>
      <button class="ib" data-mip="-1" title="MIP όλου του όγκου">∞</button>
    </div>
    <i class="sep"></i>
    <div class="grp seg" role="group" aria-label="Παράθυρο">
      <button class="ib" data-pre="0" title="Αυτόματο παράθυρο">A</button>
      <button class="ib ct" data-pre="1" title="Μαλακά μόρια">ΜΜ</button>
      <button class="ib ct" data-pre="2" title="Οστά">Οστά</button>
      <button class="ib ct" data-pre="3" title="Πνεύμονας">Πν.</button>
      <button class="ib ct" data-pre="4" title="Εγκέφαλος">Εγκ.</button>
    </div>
    <i class="sep"></i>
    <div class="grp" role="group" aria-label="Επαναφορά">
      <button class="ib" id="reset" title="Επαναφορά εικόνας: zoom, μετακίνηση, παράθυρο, αντιστροφή, MIP (R)">↺<span>Επαναφορά</span></button>
      <button class="ib" id="clearM" title="Σβήσιμο μετρήσεων">✕<span>μετρ.</span></button>
    </div>
    <i class="sep"></i>
    <div class="grp" role="group" aria-label="Προβολή">
      <button class="ib" id="cine" title="Αυτόματη κύλιση τομών (P)">▶<span>Cine</span></button>
      <button class="ib" id="inv" title="Αντιστροφή χρωμάτων (I)">◑<span>Αντ.</span></button>
      <button class="ib" id="png" title="Αποθήκευση εικόνας (PNG) με τις μετρήσεις">⤓<span>PNG</span></button>
      <button class="ib" id="tags" title="Στοιχεία DICOM της τομής (T)">ⓘ<span>Tags</span></button>
      <button class="ib" id="keys" title="Συντομεύσεις πληκτρολογίου (?)">⌨</button>
    </div>
  </nav>

  <section class="pt" id="pt" aria-live="polite"></section>

  <aside class="rail" id="rail" aria-label="Σειρές"><div class="lbl">Σειρές</div><div class="empty">Καμία μελέτη ανοιχτή.</div></aside>

  <main class="view" id="view" aria-label="Εικόνα">
    <canvas id="cv"></canvas>
    <canvas id="cv3" hidden></canvas>
    <div id="vk3" hidden style="position:absolute;inset:0;z-index:2;background:#000"></div>
    <div class="p3" id="p3" hidden>
      <div class="grp seg"><button class="ib" data-p3="organs">Όργανα</button><button class="ib" data-p3="contrast">Σκιαγραφικό</button><button class="ib" data-p3="vessels">Αγγεία</button><button class="ib" data-p3="bone">Οστά</button><button class="ib" data-p3="stone">Λίθοι</button><button class="ib" data-p3="skin">Δέρμα</button><button class="ib" data-p3="mip">MIP</button></div>
      <div class="grp seg"><button class="ib" data-v3="ant" title="Πρόσθια">Π</button><button class="ib" data-v3="post" title="Οπίσθια">Ο</button><button class="ib" data-v3="rt" title="Δεξιά πλάγια">Δ</button><button class="ib" data-v3="lt" title="Αριστερή πλάγια">Α</button><button class="ib" data-v3="sup" title="Από πάνω">↓</button><button class="ib" data-v3="inf" title="Από κάτω">↑</button></div>
      <label title="Κατώφλι: τι φαίνεται (και δεξί σύρσιμο πάνω/κάτω)">κατώφλι<input type="range" id="p3s" min="-600" max="600" step="10" value="0"><span class="v" id="p3sv">0 HU</span></label>
      <label title="Κόψιμο από μπροστά (για να φανεί το εσωτερικό)">κόψιμο<input type="range" id="p3c" min="0" max="95" value="0"></label>
      <label title="Αδιαφάνεια">αδιαφ.<input type="range" id="p3o" min="10" max="300" value="100"></label>
      <button class="ib" id="p3png" title="Αποθήκευση 3D εικόνας">⤓</button>

const deacc = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function lev(a,b){
  if(a===b) return 0; if(!a) return b.length; if(!b) return a.length;
  let p = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const c=[i]; for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }

// σκορ ονόματος φακέλου/DICOM απέναντι στο επώνυμο: ακριβής λέξη 3 · τυπογραφικό λάθος (≈) 2 · μέρος λέξης 1

}

/* ================= DICOM: ανάγνωση στοιχείων ================= */
function tagv(img,g,e){

const NOT_DICOM = /\.(jpe?g|png|gif|bmp|txt|htm|html|xml|pdf|exe|ini|inf|dll|ico|js|css|json|zip|rar|7z|lnk|db|log|mp4|avi|doc|docx|xls|xlsx|bat|cmd|sys|cab|msi|url|autorun)$/i;

async function parseFile(file){

/* ===== 7/11: ανάγνωση + αποκωδικοποίηση σε Web Workers (πολλοί πυρήνες, η οθόνη δεν «κολλάει») ===== */
// Η ίδια συνάρτηση τρέχει μέσα στους workers και (αν δεν γίνεται worker) στο κύριο νήμα.
function wkHandle(daikon, msg){
  const TAGS=[[0x0010,0x1010],[0x0008,0x0018],[0x0008,0x0008],[0x0008,0x0020],[0x0008,0x0021],[0x0008,0x0022],[0x0008,0x0023],[0x0008,0x0030],[0x0008,0x0060],[0x0008,0x0070],[0x0008,0x0080],[0x0008,0x1030],[0x0008,0x103E],[0x0008,0x1090],
    [0x0010,0x0010],[0x0010,0x0020],[0x0010,0x0030],[0x0010,0x0040],[0x0018,0x0010],[0x0018,0x0050],[0x0018,0x0060],[0x0018,0x0086],[0x0018,0x1151],[0x0018,0x1210],
    [0x0020,0x0012],[0x0020,0x0013],[0x0020,0x0032],[0x0020,0x0100],[0x0028,0x0010],[0x0028,0x0030]];
  const D8=v=>v instanceof Date ? v.getFullYear()+String(v.getMonth()+1).padStart(2,'0')+String(v.getDate()).padStart(2,'0') : v;

    return String(v==null?'':v).replace(/\^/g,' ').replace(/\0/g,'').trim(); }catch(e){ return ''; } };
  const own=d=>{ if(!d) return d; if(d.byteOffset||d.buffer.byteLength!==d.byteLength) d=d.slice(); return d; };
  const compact=(d,rgb)=>{ if(!d||!d.length||d instanceof Int16Array) return own(d); for(let i=0;i<d.length;i+=7){ const v=d[i]; if(v!==(v|0)||v<-32768||v>32767) return own(d); }
    for(let i=0;i<d.length;i++){ const v=d[i]; if(v!==(v|0)||v<-32768||v>32767) return own(d); } return Int16Array.from(d); };
  return msg.file.arrayBuffer().then(buf=>{
    const img=daikon.Series.parseImage(new DataView(buf));
    if(!img||!img.hasPixelData()||!img.getRows()) return {msg:{id:msg.id, skip:true, bytes:buf.byteLength}, tr:[]};
    const frames=img.getNumberOfFrames()||1, pi=String(img.getPhotometricInterpretation()||'').trim(), rgb=/RGB|YBR/.test(pi);
    const dec=f=>compact(f>=0?img.getInterpretedData(false,false,f):img.getInterpretedData(false,false), rgb);
    if(msg.decodeOnly){ const d=dec(msg.frame); return {msg:{id:msg.id, px:[d]}, tr:d?[d.buffer]:[]}; }
    const tags={}; for(const [g,e] of TAGS){ const v=tv(img,g,e); if(v) tags[g+','+e]=v; }
    const meta={base:img.getSeriesId()||'σειρά', rows:img.getRows(), cols:img.getCols(), frames, pos:img.getImagePosition(), dirs:img.getImageDirections(), sp:img.getPixelSpacing(), pi,
      sdesc:img.getSeriesDescription(), idesc:img.getImageDescription(), snum:img.getSeriesNumber(), mod:img.getModality(), thick:img.getSliceThickness(),
      wc:img.getWindowCenter(), ww:img.getWindowWidth(), inum:img.getImageNumber(), tags};
    let px=null; const tr=[];
    if(msg.keep){ px=[]; for(let f=0;f<frames;f++){ const d=dec(frames>1?f:-1); px.push(d); if(d) tr.push(d.buffer); } }
    return {msg:{id:msg.id, meta, px, bytes:buf.byteLength}, tr};
  }).catch(err=>({msg:{id:msg.id, err:String(err&&err.message||err)}, tr:[]}));
}
const WK=(()=>{

function mkImg(m){ const T=m.tags||{}; return { getSeriesId:()=>m.base, getRows:()=>m.rows, getCols:()=>m.cols, getNumberOfFrames:()=>m.frames, getImagePosition:()=>m.pos, getImageDirections:()=>m.dirs,
  getPixelSpacing:()=>m.sp, getPhotometricInterpretation:()=>m.pi, getSeriesDescription:()=>m.sdesc, getImageDescription:()=>m.idesc, getSeriesNumber:()=>m.snum, getModality:()=>m.mod,

// πρώτο DICOM ενός φακέλου (βάθος έως 5, έως 25 προσπάθειες) → στοιχεία ασθενή/μελέτης
async function dicomInfo(dir){
  let tries = 0;
  async function walk(d, depth){
    const subs = [];
    for await (const [name, h] of d.entries()){
      if(h.kind==='file'){
        if(tries>=25) return null;
        let f; try{ f = await h.getFile(); }catch(e){ continue; }
        if(!isCand(name, f.size)) continue;
        tries++;
        try{ const {img} = await parseFile(f); if(img && img.getRows && img.getRows()) return {
          name: tagv(img,0x0010,0x0010), pid: tagv(img,0x0010,0x0020), dob: tagv(img,0x0010,0x0030),
          date: tagv(img,0x0008,0x0020), mod: (img.getModality&&img.getModality())||tagv(img,0x0008,0x0060), desc: tagv(img,0x0008,0x1030) }; }catch(e){}
      } else if(depth<5) subs.push(h);
    }
    for(const s of subs){ const r = await walk(s, depth+1); if(r) return r; if(tries>=25) return null; }
    return null;
  }

}
const dDate = s => { s=String(s||''); let m=s.match(/^(\d{4})(\d{2})(\d{2})$/)||s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m) return new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
  if(/[A-Za-z]{3} [A-Za-z]{3} \d{1,2} \d{4}/.test(s)){ const d=new Date(s); if(!isNaN(d)) return d; } return null; };
const fmtD = s => { const d=dDate(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : ''; };
const digits = s => String(s||'').replace(/\D/g,'');
// ΑΜΚΑ → ημ. γέννησης (ΗΗΜΜΕΕ) για σύγκριση με το DICOM
function amkaDob(a){ a=digits(a); if(a.length!==11) return ''; const yy=+a.slice(4,6), cy=new Date().getFullYear()%100; return String((yy>cy?1900:2000)+yy)+a.slice(2,4)+a.slice(0,2); }
function idScore(info){
  if(!Q || !info) return {s:0, why:[]};
  let s = 0; const why = [];
  const pid = digits(info.pid);
  if(pid && ((Q.amka && pid===digits(Q.amka)) || (Q.am && pid===digits(Q.am)))){ s+=50; why.push('ίδιο '+(pid===digits(Q.amka)?'ΑΜΚΑ':'ΑΜ')); }
  else if(Q.amka && info.dob && info.dob===amkaDob(Q.amka)){ s+=30; why.push('ίδια ημ. γέννησης με τον ΑΜΚΑ'); }
  const sd = dDate(info.date), ad = dDate(Q.ad);
  if(sd && ad){ const days = Math.abs(sd-ad)/864e5; if(days<=21){ s+=20; why.push('μελέτη κοντά στην εισαγωγή'); } }
  return {s, why};
}

/* ================= Αναζήτηση στον φάκελο της κλινικής ================= */
// Δομή: OUROLOGIKH KLINIKH / <ειδικευόμενος> / <επώνυμο ασθενή> / …
async function searchServer(root, surname){
  const found = []; const t0 = performance.now();
  status('Ψάχνω «'+surname+'» στον φάκελο '+root.name+'…');
  async function level(dir, path, depth){
    const subs = [];
    for await (const [name, h] of dir.entries()) if(h.kind==='directory') subs.push([name,h]);
    for(const [name,h] of subs){
      const sc = nameScore(name, surname);
      if(sc>0) found.push({h, name, path: path.concat(name), sc});
    }
    return subs;
  }
  const lv1 = await level(root, [], 1);
  if(!found.some(f=>f.sc===3)){
    for(const [name,h] of lv1){ try{ await level(h, [name], 2); }catch(e){} }
  }
  // κράτα τα καλύτερα (αν υπάρχει ακριβές, τα «μέρος λέξης» φεύγουν)
  const top = Math.max(0,...found.map(f=>f.sc));
  let L = found.filter(f=>f.sc>= (top===3?2:1)).sort((a,b)=>b.sc-a.sc || a.path.join('/').localeCompare(b.path.join('/')));
  L = L.slice(0,12);
  return {list:L, ms:performance.now()-t0};
}
// Βαθιά αναζήτηση: διαβάζει το όνομα ασθενή μέσα στα DICOM (αργό — μόνο όταν δεν βρέθηκε φάκελος)
async function deepSearch(root, surname, onHit){
  const t0 = performance.now(), LIMIT = 90000; let seen = 0;
  async function walk(d, path, depth){
    if(performance.now()-t0 > LIMIT) return;
    const subs = []; let hasFile = false;
    for await (const [name,h] of d.entries()){ if(h.kind==='directory') subs.push([name,h]); else hasFile = true; }
    if(hasFile && depth>=2){
      seen++; if(seen%5===0) status('Βαθιά αναζήτηση… '+seen+' φάκελοι · '+fmt((performance.now()-t0)/1000,0)+' s');
      const info = await dicomInfo(d);
      if(info && nameScore(info.name, surname)>=2){ onHit({h:d, name:path[path.length-1]||d.name, path, sc:nameScore(info.name,surname), info}); return; }
    }
    if(depth<5) for(const [n,h] of subs) await walk(h, path.concat(n), depth+1);
  }
  await walk(root, [], 0);
  return {timeout: performance.now()-t0 > LIMIT, seen};
}

async function collect(dir, out, depth){
  // 7/11: τα αρχεία ζητούνται παράλληλα (δίκτυο/CD πολύ πιο γρήγορα)

}
async function runSearch(root){

// src (προαιρετικό): ροή αρχείων που έρχονται σιγά-σιγά (δεξί κλικ → «Άνοιγμα με»): {done, wait(), take()}
async function ingest(files, src){
  files=files.filter(f=>isCand(f.name, f.size));
  if(!files.length && !src){ status('Δεν βρέθηκαν αρχεία DICOM σε αυτόν τον φάκελο.', true); return false; }
  if(typeof daikon==='undefined'){ status('Η βιβλιοθήκη ανάγνωσης DICOM δεν φόρτωσε· έλεγξε τη σύνδεση στο internet και ξαναφόρτωσε τη σελίδα.', true); return false; }
  // νέα φόρτωση = νέα «γενιά»: ό,τι φέρνουν ακόμη οι workers της προηγούμενης αγνοείται
  const gen=++S.gen;
  S.series=[]; S.cur=null; S.meas={}; lru.length=0; FC=null; PK=null; S.touched=false; S.drag=null;
  const L={gen, mem:0, px:null, file:null, t0:performance.now(), total:files.length, done:0, ok:0, skip:0, dup:0, bytes:0, first:null, end:null, sops:new Set(), split:new Set(), posAcq:new Map()};
  S.load=L; status(); const q=files.slice(); let lastUi=0;
  const pull=()=>{ if(src){ const nw=src.take().filter(f=>isCand(f.name,f.size)); if(nw.length){ q.push(...nw); L.total+=nw.length; } } };
  async function worker(){
    while(gen===S.gen){
      if(!q.length) pull();
      if(!q.length){ if(!src || src.done) break; await src.wait(); continue; }
      const f=q.shift();
      try{
        const r=await WK.parse(f, L.mem < MEM_BUDGET);
        if(gen!==S.gen) return;
        L.bytes+=r.bytes||0;
        if(r.meta){
          L.px=r.px; L.file=f;
          const ser=addImage(mkImg(r.meta), L);
          if(ser){ L.ok++;
            if(!S.cur) select(ser);
            if(L.first===null && S.cur===ser){ drawNow(); L.first=performance.now()-L.t0; } }
        } else L.skip++;
      }catch(e){ if(gen!==S.gen) return; L.skip++; }
      L.done++;
      const now=performance.now(); if(now-lastUi>250){ lastUi=now; status(); renderRail(); draw(); }
    }
  }
  await Promise.all(Array.from({length:Math.max(6, WK.N*2)},worker));
  if(gen!==S.gen) return false;
  L.end=performance.now()-L.t0;
  // ανοίγει η σειρά με τις περισσότερες τομές (συνήθως η κύρια) — ΜΟΝΟ αν ο χρήστης δεν έχει ήδη αρχίσει να κοιτάει
  if(!S.touched){
    const main = S.series.slice().sort((a,b)=>(isMain(b)-isMain(a)) || b.slices.length-a.slices.length)[0];
    if(main) select(main);
  }
  status(); renderRail(true); draw();
  return true;
}
function status(msg, warn){
  const el=$('status');
  if(msg){ el.innerHTML = warn ? '<span style="color:var(--warn)">'+esc(msg)+'</span>' : esc(msg); return; }
  const L=S.load;
  if(!L){ el.textContent='Άνοιξε τον φάκελο της κλινικής, ενός CD ή του δικτύου.'; return; }
  el.innerHTML='Αρχεία <b>'+L.done+' / '+L.total+'</b> · '+fmt(L.bytes/1048576,0)+' MB · '+S.series.length+' σειρ.'
    +(L.first!==null?' · πρώτη εικόνα σε <b class="good">'+fmt(L.first/1000)+' s</b>':'')
    +(L.end!==null?' · όλα σε <b>'+fmt(L.end/1000)+' s</b>':' · φορτώνει…')
    +(S.cur&&S.cur._lastBuild?' · ανασύνθεση σε '+fmt(S.cur._lastBuild/1000)+' s':'')
    +(L.skip?' · '+L.skip+' παραλείφθηκαν (όχι εικόνες)':'')
    +(L.dup?' · '+L.dup+' διπλότυπα':'');
}

async function walk(entry, out){
  if(entry.isFile){ await new Promise(r=>entry.file(f=>{out.push(f);r();},()=>r())); return; }
  if(entry.isDirectory){ const rd=entry.createReader(); let batch;
    do{ batch=await new Promise(r=>rd.readEntries(r,()=>r([]))); for(const en of batch) await walk(en,out); } while(batch.length); }
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range') return;
  // 8/11: συντομεύσεις και με ελληνικό πληκτρολόγιο (ε→E, χ→X, ρ→R…) — από τη θέση του πλήκτρου
  const k=(/^Key[A-Z]$/.test(e.code) && /[\u0370-\u03ff]/.test(e.key)) ? (e.shiftKey ? e.code.slice(3) : e.code.slice(3).toLowerCase()) : e.key;
  if(k==='d'||k==='D') set3dVK(!VK.on);
  else if(k==='x'||k==='X') setMpr3(!S.mpr3);
  else if(k==='p'||k==='P') cine(!S.cineT);
  else if(k==='i'||k==='I'){ S.inv=!S.inv; PK=null; draw(); }
  else if(k==='t'||k==='T') tagsShow();
  else if(k==='?') keysShow();
  else if(k==='Escape' && VK.on) set3dVK(false);
});

// .nct = πακέτο του «Άνοιγμα με» (δεξί κλικ σε φάκελο): "NCT1", πλήθος, [μήκος ονόματος, όνομα UTF-8, μέγεθος (int64), δεδομένα]…
// Δεν διαβάζεται ολόκληρο: κάθε αρχείο είναι ένα «κομμάτι» (slice) του ίδιου αρχείου στον δίσκο.
// NCT2: ροή — κεφαλίδα "NCT2", -1, μετά [μήκος ονόματος, όνομα, μέγεθος, δεδομένα]… και 0 στο τέλος.
// Το αρχείο ΜΕΓΑΛΩΝΕΙ όσο το διαβάζουμε: κάθε εγγραφή διαβάζεται αμέσως στη μνήμη (με νέο «στιγμιότυπο» αν άλλαξε το αρχείο).
async function nctStream(h){
  let f=await h.getFile(); const head=new DataView(await f.slice(0,8).arrayBuffer());
  if(head.byteLength<8 || head.getUint32(0,false)!==0x4E435432) return null;   // όχι NCT2 → παλιός τρόπος
  const st={done:false, buf:[], waiters:[], take(){ const b=this.buf; this.buf=[]; return b; }, wait(){ return new Promise(r=>this.waiters.push(r)); }};
  const wake=()=>{ const w=st.waiters; st.waiters=[]; w.forEach(r=>r()); };
  const td=new TextDecoder();
  const read=async (o,n)=>{ for(let t=0;t<4;t++){ try{ if(f.size<o+n) f=await h.getFile(); if(f.size<o+n) return null; return await f.slice(o,o+n).arrayBuffer(); }catch(e){ f=await h.getFile(); } } return null; };
  (async ()=>{ let o=8, idle=0, i=0;
    while(true){
      const a=await read(o,4); if(!a){ if(++idle>600){ break; } await new Promise(r=>setTimeout(r,100)); continue; }
      const l=new DataView(a).getInt32(0,true); if(l===0){ break; }
      const nb=await read(o+4,l), sb=nb && await read(o+4+l,8); if(!sb){ if(++idle>600) break; await new Promise(r=>setTimeout(r,100)); continue; }
      const sz=Number(new DataView(sb).getBigInt64(0,true)), data=await read(o+12+l,sz); if(!data){ if(++idle>600) break; await new Promise(r=>setTimeout(r,100)); continue; }
      idle=0; const name=td.decode(nb).split(/[\\/]/).pop()||('f'+i); i++;
      st.buf.push(new File([data], name, {type:'application/dicom'})); o+=12+l+sz; wake();
    }
    st.done=true; wake(); })();
  return st;
}
async function unNct(f){
  const rd=async (o,n)=>new DataView(await f.slice(o,o+n).arrayBuffer());
  let h=await rd(0,8); if(h.getUint32(0,false)!==0x4E435431) throw new Error('άγνωστη μορφή');
  const n=h.getInt32(4,true), out=[]; let o=8; const td=new TextDecoder();
  status('Ανοίγω τον φάκελο ('+n+' αρχεία)…');
  for(let i=0;i<n && o<f.size;i++){
    const l=(await rd(o,4)).getInt32(0,true); o+=4;
    const name=td.decode(await f.slice(o,o+l).arrayBuffer()); o+=l;
    const sz=Number((await rd(o,8)).getBigInt64(0,true)); o+=8;
    out.push(new File([f.slice(o,o+sz)], name.split(/[\\/]/).pop()||('f'+i), {type:'application/dicom'})); o+=sz;
  }
  return out;
}
async function* walkDir(dh){ for await (const [n,h] of dh.entries()){ if(h.kind==='file') yield await h.getFile(); else yield* walkDir(h); } }

// Απόδοση όγκου με τη βιβλιοθήκη vtk.js (Kitware), φωτισμός και τα δοκιμασμένα πρότυπα του 3D Slicer (CT-AAA, CT-Bone, CT-Muscle…).
const VK = { on:false, ready:null, grw:null, ren:null, rw:null, vol:null, map:null, ser:null, preset:'organs', clip:0, shift:0, opac:1, plane:null, img:null };
// [HU, opacity] και [HU, r,g,b] — από τα presets του 3D Slicer (VolumeRendering/presets.xml)
const VKP = {
  organs: { n:'Όργανα',  o:[[-3024,0],[-155,0],[217,0.68],[420,0.83],[3071,0.8]], c:[[-3024,0,0,0],[-155,0.55,0.25,0.15],[217,0.88,0.6,0.29],[420,1,0.94,0.95],[3071,0.83,0.66,1]] },        // CT-Muscle
  contrast:{ n:'Σκιαγραφικό', o:[[-3024,0],[67,0],[251,0.45],[439,0.63],[3071,0.62]], c:[[-3024,0,0,0],[67,0.55,0.25,0.15],[251,0.88,0.6,0.29],[439,1,0.94,0.95],[3071,0.83,0.66,1]] }, // CT-Chest-Contrast-Enhanced
  vessels: { n:'Αγγεία',   o:[[-3024,0],[144,0],[166,0.69],[214,0.7],[420,0.83],[3071,0.8]], c:[[-3024,0,0,0],[144,0.62,0.36,0.18],[166,0.88,0.6,0.29],[214,1,1,1],[420,1,0.94,0.95],[3071,0.83,0.66,1]] }, // CT-AAA
  bone:    { n:'Οστά',     o:[[-3024,0],[-16,0],[641,0.72],[3071,0.71]], c:[[-3024,0,0,0],[-16,0.73,0.25,0.3],[641,0.91,0.82,0.55],[3071,1,1,1]] },                                    // CT-Bone
  skin:    { n:'Δέρμα',    o:[[-3024,0],[-1000,0],[-500,0],[-499,1],[3071,1]], c:[[-3024,0,0,0],[-1000,0.62,0.36,0.18],[-500,0.88,0.6,0.29],[3071,0.83,0.66,1]] },                   // CT-Skin
  stone:   { n:'Λίθοι',    o:[[-3024,0],[250,0],[350,0.85],[3071,0.9]], c:[[-3024,0,0,0],[250,1,0.85,0.3],[700,1,0.95,0.7],[3071,1,1,1]] },
  mip:     { n:'MIP', mip:true },
};
function vkLoad(){
  if(window.vtk) return Promise.resolve(true);
  if(VK.ready) return VK.ready;
  VK.ready = new Promise(res=>{ const s=document.createElement('script'); s.src='vendor/vtk-38.0.5.js'; s.onload=()=>res(!!window.vtk); s.onerror=()=>res(false); document.head.appendChild(s); });
  return VK.ready;
}
function vkTF(){
  const p=VKP[VK.preset]||VKP.organs, prop=VK.vol.getProperty(), sh=VK.shift;
  const ctf=vtk.Rendering.Core.vtkColorTransferFunction.newInstance(), pwf=vtk.Common.DataModel.vtkPiecewiseFunction.newInstance();
  if(p.mip){ const lo=S.wc-S.ww/2, hi=S.wc+S.ww/2; ctf.addRGBPoint(lo,0,0,0); ctf.addRGBPoint(hi,1,1,1); pwf.addPoint(lo,0); pwf.addPoint(hi,1); VK.map.setBlendModeToMaximumIntensity(); prop.setShade(false); }
  else { p.c.forEach(([h,r,g,b])=>ctf.addRGBPoint(h+sh,r,g,b)); p.o.forEach(([h,a])=>pwf.addPoint(h+sh,Math.min(1,a*VK.opac))); VK.map.setBlendModeToComposite(); prop.setShade(true); }
  prop.setRGBTransferFunction(0,ctf); prop.setScalarOpacity(0,pwf);
  prop.setAmbient(0.15); prop.setDiffuse(0.85); prop.setSpecular(0.25); prop.setSpecularPower(15);
  prop.setInterpolationTypeToLinear();
  prop.setUseGradientOpacity(0,false); prop.setGradientOpacityMinimumValue(0,2); prop.setGradientOpacityMinimumOpacity(0,0); prop.setGradientOpacityMaximumValue(0,20); prop.setGradientOpacityMaximumOpacity(0,1);
  if(p.mip) prop.setUseGradientOpacity(0,false);
}
function vkClip(){
  if(!VK.map) return; VK.map.removeAllClippingPlanes();
  if(VK.clip>0){ const b=VK.img.getBounds(); const y=b[2]+(b[3]-b[2])*VK.clip; const pl=vtk.Common.DataModel.vtkPlane.newInstance({origin:[0,y,0], normal:[0,1,0]}); VK.map.addClippingPlane(pl); }
}
function vkRender(){ if(VK.rw) VK.rw.render(); }
function vkView(v){
  const cam=VK.ren.getActiveCamera(), c=VK.img.getCenter(), b=VK.img.getBounds(), D=Math.max(b[1]-b[0],b[3]-b[2],b[5]-b[4])*2.2;
  const P={ant:[0,-1,0],post:[0,1,0],rt:[-1,0,0],lt:[1,0,0],sup:[0,0,1],inf:[0,0,-1]}[v]||[0,-1,0];
  cam.setFocalPoint(...c); cam.setPosition(c[0]+P[0]*D, c[1]+P[1]*D, c[2]+P[2]*D);
  cam.setViewUp(...(v==='sup'||v==='inf' ? [0,-1,0] : [0,0,1]));
  VK.ren.resetCamera(); cam.zoom(1.35); VK.ren.resetCameraClippingRange(); vkRender();
}
async function vkBuild(ser){
  const ok=await vkLoad(); if(!ok){ status('Δεν φόρτωσε η βιβλιοθήκη 3D (vtk.js).', true); return false; }
  const n=ser.slices.length, W0=ser.cols, H0=ser.rows, plane=W0*H0, vol=ser.vol;
  // έως ~90 εκ. voxels στον υπολογιστή (αλλιώς σμίκρυνση στο x/y)
  const VMAX = touch ? 12e6 : 40e6; let f=1;   // 7/11: γρηγορότερη περιστροφή (πριν 90 εκ.) while((W0/f)*(H0/f)*n > VMAX) f++;
  const w=Math.floor(W0/f), h=Math.floor(H0/f);
  const arr=new Int16Array(w*h*n);
  // z αντεστραμμένο: δείκτης 0 = η πιο ουραία τομή → το «πάνω» της κάμερας είναι κεφαλικά
  for(let z=0;z<n;z++){ const src=(n-1-z)*plane, dst=z*w*h;
    if(f===1) arr.set(vol.subarray(src,src+plane), dst);
    else for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let s=0; for(let yy=0;yy<f;yy++){ const r=src+(y*f+yy)*W0+x*f; for(let xx=0;xx<f;xx++) s+=vol[r+xx]; } arr[dst+y*w+x]=Math.round(s/(f*f)); }
    if(z%40===39){ status('Προετοιμασία 3D… '+Math.round((z+1)/n*100)+'%'); await new Promise(r=>setTimeout(r)); } }
  const img=vtk.Common.DataModel.vtkImageData.newInstance();
  img.setDimensions(w,h,n); img.setSpacing(ser.spc*f, ser.spr*f, ser.zsp||1); img.setOrigin(0,0,0);
  img.getPointData().setScalars(vtk.Common.Core.vtkDataArray.newInstance({name:'HU', numberOfComponents:1, values:arr}));
  if(!VK.grw){
    const box=$('vk3'); VK.grw=vtk.Rendering.Misc.vtkGenericRenderWindow.newInstance({background:[0,0,0]}); VK.grw.setContainer(box); VK.grw.resize();
    VK.ren=VK.grw.getRenderer(); VK.rw=VK.grw.getRenderWindow();
    VK.map=vtk.Rendering.Core.vtkVolumeMapper.newInstance(); VK.vol=vtk.Rendering.Core.vtkVolume.newInstance(); VK.vol.setMapper(VK.map); VK.ren.addVolume(VK.vol);
    new ResizeObserver(()=>{ if(VK.on){ VK.grw.resize(); vkRender(); } }).observe(box);
    // κατά την περιστροφή: απόδοση σε μικρότερη ανάλυση (γρήγορα)· μόλις αφήσεις το ποντίκι: πλήρης ποιότητα
    try{ const it=VK.grw.getInteractor(); it.setDesiredUpdateRate(20); it.setStillUpdateRate(0.01);
      it.onStartInteractionEvent(()=>{ try{ VK.map.setImageSampleDistance(2); }catch(e){} });
      it.onEndInteractionEvent(()=>{ try{ VK.map.setImageSampleDistance(1); }catch(e){} vkRender(); }); }catch(e){}
  }
  VK.map.setInputData(img); VK.img=img; VK.ser=ser;
  const sp=Math.min(ser.spc*f, ser.spr*f, ser.zsp||1); VK.map.setSampleDistance(sp*0.85); VK.map.setMaximumSamplesPerRay(1200);
  try{ VK.map.setAutoAdjustSampleDistances(true); VK.map.setInteractionSampleDistanceFactor(2.5); }catch(e){}
  try{ VK.map.setPreferSizeOverAccuracy(true); }catch(e){}
  vkTF(); vkClip(); status(); return true;
}
async function set3dVK(on){
  const box=$('vk3');

  const q = EVO.q, M = [['CT','CT'],['XR','Ακτινογρ.'],['US','US'],['*','Όλα']];   // 8/11: χωρίς MRI (δεν γίνονται στο νοσοκομείο)
  ov.innerHTML = '<div class="evo-box"><div class="evo-h"><b>🩻 Evorad</b><input data-k="sur" placeholder="Επώνυμο (ελλ. ή λατ.)" value="'+evoE(q.sur)+'"><input data-k="fn" placeholder="Όνομα" value="'+evoE(q.fn)+'"><input data-k="amka" placeholder="ΑΜΚΑ / ID" inputmode="numeric" value="'+evoE(q.amka)+'">'
    + '<label>από <input type="date" data-k="from" value="'+evoE(q.from)+'"></label><label>έως <input type="date" data-k="to" value="'+evoE(q.to)+'"></label>'
    + '<button class="ib" data-login title="Σύνδεση στον Evorad (ανοίγει η σελίδα του· βάζεις εσύ τα στοιχεία σου)">🔑 Σύνδεση</button><span class="evo-m">'+M.map(([v,t])=>'<button data-mod="'+v+'" class="'+(q.mod===v?'on':'')+'">'+t+'</button>').join('')+'</span><span style="flex:1"></span><button class="ib" data-x title="Κλείσιμο (Esc)" aria-label="Κλείσιμο" style="font-size:18px;padding:4px 12px">✕</button></div><div class="evo-l" data-l></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('input', e=>{ const k = e.target.dataset && e.target.dataset.k; if(!k) return; EVO.q[k] = e.target.value; EVO.series=null; evoSoon(); });
  ov.addEventListener('click', async e=>{ const t = e.target;
    if(t===ov || t.closest('[data-x]')) return ov.remove();
    if(t.closest('[data-clr]')){ Object.assign(EVO.q, {sur:'', fn:'', amka:'', from:mo(), to:evoISO(Date.now())}); ov.querySelectorAll('[data-k]').forEach(i=>i.value = EVO.q[i.dataset.k]||''); EVO.series=null; return evoSearch(); }
    const m = t.closest('[data-mod]'); if(m){ EVO.q.mod = m.dataset.mod; ov.querySelectorAll('[data-mod]').forEach(b=>b.classList.toggle('on', b===m)); EVO.series=null; return evoSearch(); }
    if(t.closest('[data-login]')){ status('Evorad: άνοιξε το παράθυρο σύνδεσης — μετά τη σύνδεση κλείσ\' το αν δεν κλείσει μόνο του'); await DESK.evo.login(); EVO.logged=null; status(''); evoSearch(); return; }
    if(t.closest('[data-back]')){ EVO.series=null; return evoPaint(); }
    if(t.closest('[data-openall]')) return evoOpen(EVO.series);
    const sr = t.closest('[data-ser]'); if(sr){ const s = EVO.series[+sr.dataset.ser]; return evoOpen([s].concat(EVO.series.filter(z=>z!==s))); }
    const r = t.closest('[data-ex]'); if(r){ const x = EVO.exams[+r.dataset.ex]; if(x) evoSeries(x); }
  });
  ov.addEventListener('keydown', e=>{ if(e.key==='Escape') ov.remove(); if(e.key==='Enter' && EVO.exams.length===1) evoSeries(EVO.exams[0]); });
  evoPaint();
  // πρώτο άνοιγμα: αν υπάρχει φυλαγμένος λογαριασμός, σύνδεση πριν την πρώτη αναζήτηση (αν χρειάζεται)
  (async ()=>{ if(!EVO.warm && DESK.evo.auto){ EVO.warm = true; try{ if(await DESK.evo.hasCred()) await DESK.evo.auto(); }catch(e){} } evoSearch(); })();
  setTimeout(()=>{ const i = ov.querySelector('[data-k="sur"]'); if(i) i.focus(); }, 50);
}
// 8/11: παλιά εφαρμογή υπολογιστή (χωρίς Evorad/CD) → μήνυμα με την έκδοση, για να φαίνεται αμέσως τι λείπει
if(DESK) DESK.info().then(i=>{ const v = (i && i.version) || '?'; try{ document.querySelector('header h1').title = 'Έκδοση εφαρμογής '+v; }catch(e){}
  if(!DESK.evo || !DESK.cd) status('Εφαρμογή υπολογιστή έκδοση '+v+' (παλιά) — κλείσε την εφαρμογή για 1–2 λεπτά για να ενημερωθεί στη 1.0.5 (Evorad, CD).', true);
  else setTimeout(()=>{ if(!S.cur && !S.load) status('Νίκος CT Viewer '+v+' · 🩻 Evorad (E) · 💿 CD · 🗂 Φάκελος'); }, 300); }).catch(()=>{});
if(DESK && DESK.evo){
  const b = document.createElement('button'); b.className='ib primary'; b.id='evoBtn'; b.title='Αναζήτηση εξετάσεων στον Evorad (E)'; b.innerHTML='🩻<span>Evorad</span>';
  const ref = $('srvBtn'); if(ref) ref.parentNode.insertBefore(b, ref); b.onclick=()=>evoPanel();
  document.addEventListener('keydown', e=>{ if((e.key==='e'||e.key==='E'||e.key==='ε'||e.key==='Ε'||e.code==='KeyE') && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'') && !document.getElementById('evoOv')) { e.preventDefault(); evoPanel(); } });
  // άνοιγμα από τη γραμμή εντολών / από το κινητό (τηλεχειρισμός): {sur, fn, amka, examid} → αναζήτηση ή κατευθείαν η εξέταση
  const evoArgsOpen = async ev=>{ if(!ev) return;
    if(!S.cur && !S.load && Date.now() - (+(sessionStorage.getItem('nct_rl')||0)) > 120000 && await ctStale()){ try{ sessionStorage.setItem('nct_rl', String(Date.now())); sessionStorage.setItem('nct_pend', JSON.stringify(ev)); }catch(e){} location.replace('/ct?app=desktop&t='+Date.now()); return; }
    // 📱 8/11: ζεύξη τηλεχειριστηρίου — το κινητό στέλνει «PDXRC<κλειδί>» στο πεδίο fn (χωρίς στοιχεία ασθενή)
    { const m = /PDXRC([A-Za-z0-9]{24,40})/.exec(String(ev.fn||'')); if(m){ RC.pair(m[1]); ev = Object.assign({}, ev, {fn: String(ev.fn||'').replace(m[0],'').trim()}); } }
    if(!ev.examid && !ev.sur && !ev.amka && !ev.fn) return;
    const q = {sur:ev.sur||'', fn:ev.fn||'', amka:ev.amka||'', from:'', to:''};
    if(!ev.examid){ evoPanel(q); return; }
    { const o0 = document.getElementById('evoOv'); if(o0) o0.remove(); } status('Evorad: ανοίγω την εξέταση…');
    // 8/11: ΚΑΤΕΥΘΕΙΑΝ οι σειρές της εξέτασης (getSeries) — χωρίς αναζήτηση/getExams· μετά φόρτωση όλων (η μεγαλύτερη πρώτη)
    if(ev.examid){ const ex = {examid:String(ev.examid), date:'', mod:'', desc:'', first:'', last:String(ev.sur||''), amka:String(ev.amka||''), pid:'', pid2:'', birth:''};
      evoSeries(ex).then(()=>{ if(EVO.series && EVO.series.length && EVO.sel===ex) evoOpen(EVO.series); else { evoPanel(q); if(EVO.logged===false) status('Evorad: χρειάζεται σύνδεση — πάτα «🔑 Σύνδεση»', true); else status('Evorad: η εξέταση δεν άνοιξε'+(EVO.raw?' ('+EVO.raw.slice(0,80)+')':''), true); } }); } };
  DESK.info().then(i=>{ let pend = null; try{ pend = JSON.parse(sessionStorage.getItem('nct_pend')||'null'); sessionStorage.removeItem('nct_pend'); }catch(e){} evoArgsOpen(pend || (i && i.evo)); }).catch(()=>{});
  if(DESK.onEvo) DESK.onEvo(evoArgsOpen);
}

/* ================= 📱 Τηλεχειριστήριο από το κινητό (8/11) =================
   Κανάλι Supabase Realtime «broadcast» ctrc-<κλειδί>: το κινητό στέλνει ΜΟΝΟ εντολές προβολής (τομή, zoom, μετακίνηση, αντίθεση,
   σειρά, επίπεδο) και κείμενο πληκτρολογίου. Ο υπολογιστής απαντά μόνο αριθμούς τομής/σειράς — ΚΑΝΕΝΑ στοιχείο ασθενή. */
const RC = (()=>{
  if(!DESK) return {pair(){}};
  const KEY='nct_rc', U='https://evspmufooxgqxhbhydgc.supabase.co', K='sb_publishable_BOFN2Mb4jDGWcAqaIbNy_Q_FYvsz7y2';
  let toks = []; try{ toks = JSON.parse(localStorage.getItem(KEY)||'[]').filter(t=>/^[A-Za-z0-9]{24,40}$/.test(t)).slice(-6); }catch(e){}
  const chans = new Map(); let cli = null, lib = null, badge = null, lastAt = 0;
  const load = ()=> lib || (lib = new Promise(res=>{ if(window.supabase) return res(true); const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; sc.onload=()=>res(!!window.supabase); sc.onerror=()=>{ lib=null; res(false); }; document.head.appendChild(sc); }));
  const showBadge = on=>{ if(!badge){ badge=document.createElement('div'); badge.style.cssText='position:fixed;right:10px;bottom:10px;z-index:50;background:#14532D;color:#DCFCE7;border-radius:999px;padding:5px 11px;font:600 12.5px system-ui;opacity:.92;pointer-events:none;transition:opacity .4s'; document.body.appendChild(badge); }
    badge.textContent = on ? '📱 τηλεχειριστήριο' : '📱 σε αναμονή'; badge.style.opacity = on ? '.92' : '.35'; };
  const center = ()=>{ const r=view.getBoundingClientRect(); return [r.width/2, r.height/2]; };
  const serList = ()=>{ const main=S.series.filter(isMain); return (main.length && !S.showAll) ? main.concat(S.series.filter(x=>!isMain(x) && x===S.cur)) : S.series; };
  let stT = 0; const state = (ch)=>{ clearTimeout(stT); stT = setTimeout(()=>{ try{ const L=serList(), i=L.indexOf(S.cur);
    ch.send({type:'broadcast', event:'s', payload:{ i:(S.cur?S.ix[S.view]+1:0), n:(S.cur?count(S.view):0), v:S.view, si:i+1, sn:L.length, ww:Math.round(S.ww), wc:Math.round(S.wc), z:+S.zoom.toFixed(2), evo:!!document.getElementById('evoOv'), ld:!!(S.load && S.load.end==null) }}); }catch(e){} }, 60); };
  const typeText = (t, enter)=>{
    let el = document.activeElement; const isIn = el && /INPUT|TEXTAREA/.test(el.tagName) && el.type!=='range';
    if(!isIn){ const ov=document.getElementById('evoOv'); el = ov && ov.querySelector('input:not([type=date]):not([type=range])'); }
    if(!el){ if(t) evoPanel({sur:t, fn:'', amka:'', from:'', to:''}); return; }
    el.focus(); if(t!=null){ el.value = t; el.dispatchEvent(new Event('input',{bubbles:true})); }
    if(enter){ ['keydown','keyup'].forEach(ty=>el.dispatchEvent(new KeyboardEvent(ty,{key:'Enter',code:'Enter',bubbles:true}))); const fm=el.closest('form'); if(fm && fm.requestSubmit) try{ fm.requestSubmit(); }catch(e){} }
  };
  const key = k=>{ const tgt = document.getElementById('evoOv') || document; tgt.dispatchEvent(new KeyboardEvent('keydown',{key:k, code:k, bubbles:true})); };
  const act = (m, ch)=>{
    lastAt = Date.now(); showBadge(true);
    const o = m && m.o; S.touched = true;
    if(o==='step') step(Math.max(-500,Math.min(500, m.n|0)));
    else if(o==='zoom' && isFinite(m.f)){ const [x,y]=center(); zoomAt(Math.max(.5,Math.min(2,+m.f)), x, y); }
    else if(o==='pan' && isFinite(m.dx)){ S.panX += Math.max(-400,Math.min(400,+m.dx)); S.panY += Math.max(-400,Math.min(400,+m.dy||0)); draw(); }
    else if(o==='win' && isFinite(m.dx)){ const k=Math.max(1,S.ww)/300; S.ww=Math.max(1,S.ww+(+m.dx)*k*1.5); S.wc=S.wc+(+m.dy||0)*k; draw(); }
    else if(o==='preset') applyPreset(Math.max(0,Math.min(4,m.i|0)));
    else if(o==='plane' && /^(ax|cor|sag)$/.test(m.p)) setPlane(m.p);
    else if(o==='mip') setMip(S.mip===0?10:S.mip===10?30:0);
    else if(o==='reset') $('reset').click();
    else if(o==='ser'){ const L=serList(); if(L.length){ const i=Math.max(0,L.indexOf(S.cur)); select(L[(i+(m.d>0?1:-1)+L.length)%L.length]); } }
    else if(o==='text') typeText(String(m.s||'').slice(0,80), !!m.enter);
    else if(o==='key' && /^(Enter|Escape|Backspace|ArrowUp|ArrowDown)$/.test(m.k)){ if(m.k==='Escape'){ const ov=document.getElementById('evoOv'); if(ov) ov.remove(); } else if(m.k==='Enter') typeText(null, true); else key(m.k); }
    else if(o==='evo') evoPanel();
    else if(o==='hello'){}
    if(ch) state(ch);
  };
  const sub = async t=>{
    if(chans.has(t)) return; if(!(await load())) return;
    if(!cli) cli = window.supabase.createClient(U, K, {auth:{persistSession:false, autoRefreshToken:false}});
    const ch = cli.channel('ctrc-'+t, {config:{broadcast:{self:false}}}); chans.set(t, ch);
    ch.on('broadcast', {event:'c'}, ({payload})=>{ try{ (Array.isArray(payload)?payload:[payload]).slice(0,40).forEach(m=>act(m, null)); state(ch); }catch(e){} });
    ch.subscribe(st=>{ if(st==='SUBSCRIBED'){ showBadge(Date.now()-lastAt<60000); state(ch); } });
  };
  setInterval(()=>{ if(badge && Date.now()-lastAt>60000) showBadge(false); }, 15000);
  toks.forEach(sub);
  return { pair(t){ if(!/^[A-Za-z0-9]{24,40}$/.test(t)) return; toks = toks.filter(x=>x!==t).concat(t).slice(-6); try{ localStorage.setItem(KEY, JSON.stringify(toks)); }catch(e){} sub(t); status('📱 Τηλεχειριστήριο κινητού: συνδέθηκε'); } };
})();

/* ================= 🗂 Αρχείο Ασθενών (server κλινικής): /ct?pdxStudy=ID#k=ΚΛΕΙΔΙ ================= */
(async ()=>{
  const sp = new URLSearchParams(location.search), sid = sp.get('pdxStudy'); if(!sid) return;
  const key = decodeURIComponent((location.hash.match(/k=([^&]+)/)||[])[1]||''); if(key){ try{ localStorage.setItem('pdx_key', JSON.stringify(key)); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }
  let K = key; if(!K){ try{ K = JSON.parse(localStorage.getItem('pdx_key')||'""'); }catch(e){} }
  const H = {'x-pdx-key':K, 'x-pdx-user':'viewer'};
  let s; try{ const r = await fetch('/api/studies/'+encodeURIComponent(sid), {headers:H}); s = await r.json(); if(!r.ok) throw new Error(s.err||r.status); }
  catch(e){ status('Αρχείο Ασθενών: '+e.message, true); return; }
  const sops = []; s.series.slice().sort((a,b)=>b.sops.length-a.sops.length).forEach(se=>se.sops.forEach(x=>sops.push(x)));
  S.src = 'Αρχείο · '+String(s.dicom_name||'').replace(/\^/g,' ')+' · '+(s.date||'');
  const st={done:false, buf:[], waiters:[], take(){ const b=this.buf; this.buf=[]; return b; }, wait(){ return new Promise(r=>this.waiters.push(r)); }};
  const wake=()=>{ const w=st.waiters; st.waiters=[]; w.forEach(r=>r()); };
  let i=0, bad=0;
  const lane = async ()=>{ while(i<sops.length){ const a=i++; try{ const r = await fetch('/dicom/'+encodeURIComponent(sops[a]), {headers:H}); if(!r.ok) throw 0; const ab = await r.arrayBuffer(); st.buf.push(new File([ab], 'pdx'+a+'.dcm', {type:'application/dicom'}));   /* ΠΡΩΤΑ το await: το st.buf αλλάζει όσο περιμένουμε */ }catch(e){ bad++; } if(st.buf.length>=8 || i>=sops.length) wake(); } };
  (async ()=>{ await Promise.all(Array.from({length:8}, lane)); st.done=true; wake(); if(bad) status('Αρχείο: '+bad+' εικόνες δεν ήρθαν', true); })();
  await ingest([], st);
})();

window.__ct = {VK:()=>VK, unNct, nctStream, V3, set3d, render3,skel, nameScore, lev, idScore, amkaDob, setQ:q=>{Q=q;}, get S(){ return S; }, ingest, setMip, setPlane, frame, drawNow};
})();
